# Demo deployment. Supply secrets privately; resolve the public API URL before building web.
name: dots
region: sgp
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
databases:
  - name: db
    engine: PG
    production: false
services:
  - name: api
    git:
      repo_clone_url: https://github.com/snowsadh/dots.git
      branch: main
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    http_port: 3003
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /
      initial_delay_seconds: 30
    envs:
      - key: PORT
        value: "3003"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: MODEL_PROVIDER
        value: openai-compatible
        scope: RUN_TIME
      - key: MODEL_BASE_URL
        value: https://openrouter.ai/api/v1
        scope: RUN_TIME
      - key: MODEL_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: MODEL_CRITICAL
        value: google/gemma-4-26b-a4b-it
        scope: RUN_TIME
      - key: MODEL_MAX_OUTPUT_TOKENS
        value: "32768"
        scope: RUN_TIME
      - key: UPLOADS_DIR
        value: data/uploads
        scope: RUN_TIME
  - name: web
    git:
      repo_clone_url: https://github.com/snowsadh/dots.git
      branch: main
    source_dir: /
    dockerfile_path: apps/web/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs:
      - key: PORT
        value: "3000"
        scope: RUN_TIME
      - key: NEXT_PUBLIC_API_URL
        value: https://replace-with-app-host.invalid/backend
        scope: RUN_AND_BUILD_TIME
      - key: AUTH_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_TRUST_HOST
        value: "true"
        scope: RUN_TIME
      - key: AUTH_URL
        value: ${APP_URL}
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /backend
    - component:
        name: web
      match:
        path:
          prefix: /
